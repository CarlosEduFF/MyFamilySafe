services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myfamilysafe
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports: ["8080:8080"]
    depends_on: [db]

volumes:
  pgdata:
